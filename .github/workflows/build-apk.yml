name: Build NovelWriter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript
        run: pnpm check
      - name: Setup Expo/EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link or create EAS project
        run: eas init --account "$(eas whoami)" --non-interactive
      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
      - name: Download APK
        run: eas build:download --platform android --latest --non-interactive --output novelwriter-preview.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelwriter-preview-apk
          path: novelwriter-preview.apk
          if-no-files-found: error
